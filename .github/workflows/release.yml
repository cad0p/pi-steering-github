name: Auto Release

on:
  push:
    branches: [main, 'release/*']
  # Manual retrigger: a workflow file added by an API-created squash
  # merge may not fire on that same push (observed on the cad0p fleet,
  # 2026-08-14) — dispatch lets us re-run the release/publish pipeline
  # without an extra code push.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      has_changes: ${{ steps.release.outputs.has_changes }}
    steps:
      - id: release
        uses: cad0p/semver-calver-release/release@v1
        with:
          skip_release: ${{ github.ref != 'refs/heads/main' }}

  publish:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: cad0p/semver-calver-release/npm-publish@v1
        with:
          tag: v${{ needs.release.outputs.version }}
